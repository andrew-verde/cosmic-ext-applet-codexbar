name: Update provider icons

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codexbar-upstream-maintenance
  cancel-in-progress: false

jobs:
  icons:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Test the icon updater
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'

      - name: Sync and validate icons
        id: icons
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/update-icons.py
          git add data/icons/providers src/icons.rs
          python3 tools/update-icons.py --validate-staged
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install build dependencies
        if: steps.icons.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libexpat1-dev libfontconfig1-dev \
            libfreetype-dev libxkbcommon-dev libwayland-dev libudev-dev libdbus-1-dev \
            libegl-dev fonts-dejavu-core

      - uses: dtolnay/rust-toolchain@stable
        if: steps.icons.outputs.changed == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.icons.outputs.changed == 'true'

      - name: Test the applet with updated icons
        if: steps.icons.outputs.changed == 'true'
        run: cargo test --locked

      - name: Commit verified icon changes
        if: steps.icons.outputs.changed == 'true'
        run: |
          python3 tools/update-icons.py --validate-staged
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync provider icons from CodexBar'
          # A concurrent main-branch update makes this fail without overwriting it.
          git push origin HEAD:main

  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Compare upstream payload sources
        id: schema
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/check-upstream-schema.py --report /tmp/schema-report.md --github-output "$GITHUB_OUTPUT"

      - name: Report schema drift once
        if: steps.schema.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title='CodexBar CLI schema changed'
          issue="$(gh issue list --state open --search 'in:title "CodexBar CLI schema changed"' \
            --json number,title --jq '.[] | select(.title == "CodexBar CLI schema changed") | .number' | head -n 1)"
          if [ -n "$issue" ]; then
            gh issue view "$issue" --json body --jq '.body' > /tmp/previous-report.md
            python3 - <<'PY'
          from pathlib import Path
          Path('/tmp/previous-report.md').write_text(Path('/tmp/previous-report.md').read_text().rstrip() + '\n')
          PY
            if ! cmp -s /tmp/previous-report.md /tmp/schema-report.md; then
              gh issue edit "$issue" --body-file /tmp/schema-report.md
            fi
          else
            gh issue create --title "$title" --body-file /tmp/schema-report.md
          fi
