[package]
name = "cosmic-ext-applet-codexbar"
version = "0.1.0"
edition = "2024"
description = "COSMIC panel applet showing Codex / Claude Code usage limits"
license = "MIT"

[profile.release]
opt-level = 3
panic = "abort"
lto = "thin"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["process", "rt", "macros"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
default-features = false
features = ["applet", "tokio", "wayland", "winit"]

[features]
default = ["wgpu"]
wgpu = ["libcosmic/wgpu"]
