[package]
name = "codexbar-cosmic-applet"
version = "0.1.0"
edition = "2024"
description = "COSMIC panel applet showing Codex / Claude Code usage limits"
license = "MIT"
repository = "https://github.com/andrew-verde/codexbar-cosmic-applet"
readme = "README.md"

[profile.release]
opt-level = 3
panic = "abort"
lto = "thin"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
dirs = "6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["process", "rt", "macros"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
default-features = false
features = ["applet", "tokio", "wayland", "winit"]

[dev-dependencies]
# Lets the layout regression test in `src/window.rs` run iced's real layout
# pass, with real font metrics, without a GPU or a compositor.
iced_tiny_skia = { git = "https://github.com/pop-os/libcosmic" }

[features]
default = ["wgpu"]
wgpu = ["libcosmic/wgpu"]
